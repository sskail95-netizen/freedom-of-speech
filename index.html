    // =========================================================================
    // [1] Supabase 인증 및 데이터 동기화
    // =========================================================================
    async function initSupabase() {
      const { data: { session } } = await sb.auth.getSession();
      await syncUserSession(session);
      sb.auth.onAuthStateChange((_event, session) => syncUserSession(session));

      await Promise.all([loadGalleryPostsFromDB(), loadGifticonsFromDB()]);

      // 실시간 새 글/추천 감지 (Supabase Realtime)
      sb.channel('public-posts-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
          loadGalleryPostsFromDB().then(() => { if (state.activeTab === 'gallery') renderCurrentView(); });
        })
        .subscribe();
    }

    async function syncUserSession(session) {
      state.authUser = session?.user || null;
      if (state.authUser) {
        const { data: profile } = await sb.from('profiles').select('*').eq('id', state.authUser.id).single();
        const { data: txs } = await sb.from('point_transactions').select('*').eq('user_id', state.authUser.id).order('created_at', { ascending: false }).limit(30);
        const { data: orders } = await sb.from('gifticon_orders').select('*, gifticons(*)').eq('user_id', state.authUser.id).order('created_at', { ascending: false });

        const todayStr = new Date().toISOString().slice(0, 10);
        state.user.nickname = profile?.nickname || state.authUser.email.split('@')[0];
        state.user.points = profile?.points ?? 0;
        state.user.attendedToday = profile?.last_attendance_date === todayStr;
        state.user.level = state.user.points >= 1000 ? 'Lv.7 실버 변론가' : 'Lv.2 시민 배심원';
        state.user.pointHistory = (txs || []).map(t => ({
          id: t.id,
          date: new Date(t.created_at).toLocaleString('ko-KR'),
          reason: t.reason,
          amount: t.amount,
          type: t.amount > 0 ? 'earn' : 'spend'
        }));
        state.user.gifticons = (orders || []).map(o => ({
          id: o.id,
          brand: o.gifticons?.brand || '기프티콘',
          name: o.gifticons?.name || '모바일 교환권',
          emoji: '🎁',
          bg: 'from-indigo-500 to-violet-600',
          pin: o.coupon_code,
          issuedAt: new Date(o.created_at).toLocaleString('ko-KR'),
          expiresAt: '발급일로부터 90일'
        }));
      } else {
        state.user.nickname = '게스트 (로그인 필요)';
        state.user.points = 0;
        state.user.attendedToday = false;
        state.user.pointHistory = [];
        state.user.gifticons = [];
      }
      updateHeaderUI();
      renderCurrentView();
    }

    async function loadGalleryPostsFromDB() {
      const { data } = await sb
        .from('posts')
        .select('*, profiles(nickname), comments(*, profiles(nickname))')
        .order('created_at', { ascending: false });

      state.galleryPosts = (data || []).map(p => ({
        id: p.id,
        board: p.board_type,
        title: p.title,
        author: p.profiles?.nickname || '익명시민',
        time: new Date(p.created_at).toLocaleString('ko-KR'),
        likes: p.likes_count || 0,
        isHot: p.is_hot,
        mediaUrl: p.media_url,
        mediaType: p.media_type || 'none',
        content: p.content,
        comments: (p.comments || []).map(c => ({
          author: c.profiles?.nickname || '익명',
          text: c.content,
          time: new Date(c.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
        }))
      }));
    }

    async function loadGifticonsFromDB() {
      const { data } = await sb.from('gifticons').select('*').order('price_points');
      const visuals = [
        { emoji: '☕', bg: 'from-emerald-600 to-green-700' },
        { emoji: '🏪', bg: 'from-indigo-500 to-violet-600' },
        { emoji: '🍗', bg: 'from-orange-500 to-red-600' }
      ];
      state.shopItems = (data || []).map((g, idx) => ({
        id: g.id,
        brand: g.brand,
        name: g.name,
        price: g.price_points,
        stock: g.stock,
        emoji: visuals[idx % visuals.length].emoji,
        bg: visuals[idx % visuals.length].bg,
        badge: `재고 ${g.stock}개`,
        desc: 'Supabase 포인트로 즉시 쿠폰 번호가 발급됩니다.'
      }));
    }

        if (confirm(`${state.user.nickname}님, 로그아웃 하시겠습니까?`)) {
          sb.auth.signOut().then(() => showToast('로그아웃 되었습니다.', 'info'));
        }
      } else {
        openAuthModal();
      }
    }

    function openAuthModal() {
      const html = `
        <div class="modal-anim w-full max-w-sm rounded-3xl bg-white p-6 text-slate-900 shadow-2xl border border-slate-200">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-extrabold">${state.isSignUpMode ? '회원가입 (+100P)' : '로그인'}</h2>
            <button onclick="closeModal()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-500">✕</button>
          </div>
          <form onsubmit="submitEmailAuth(event)" class="space-y-3">
            <input id="authEmail" type="email" required placeholder="이메일 입력" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm" />
            <input id="authPw" type="password" required minlength="6" placeholder="비밀번호 (6자 이상)" class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm" />
            <p id="authErr" class="text-xs text-rose-500 hidden"></p>
            <button type="submit" class="w-full rounded-xl bg-slate-900 py-3 text-sm font-extrabold text-white hover:bg-indigo-600 transition">
              ${state.isSignUpMode ? '가입하고 100P 받기' : '이메일로 로그인'}
            </button>
          </form>
          <div class="my-4 grid grid-cols-3 gap-2 text-xs font-bold">
            <button onclick="oauthLogin('kakao')" class="rounded-xl bg-[#FEE500] py-2.5 text-[#191919]">카카오</button>
            <button onclick="oauthLogin('google')" class="rounded-xl border border-slate-200 py-2.5">구글</button>
            <button onclick="oauthLogin('github')" class="rounded-xl bg-zinc-900 py-2.5 text-white">깃허브</button>
          </div>
          <button onclick="state.isSignUpMode=!state.isSignUpMode; openAuthModal();" class="w-full text-center text-xs text-slate-500 underline">
            ${state.isSignUpMode ? '이미 계정이 있나요? 로그인' : '계정이 없으신가요? 회원가입'}
          </button>
        </div>`;
      openModal(html);
    }

    async function submitEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPw').value;
      const errEl = document.getElementById('authErr');
      errEl.classList.add('hidden');

      const { error } = state.isSignUpMode
        ? await sb.auth.signUp({ email, password })
        : await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = error.message;
        errEl.classList.remove('hidden');
      } else {
        showToast(state.isSignUpMode ? '🎉 회원가입 완료! +100P가 적립되었습니다.' : '환영합니다! 로그인되었습니다.', 'gold');
        closeModal();
      }
    }

    async function oauthLogin(provider) {
      await sb.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin } });
    }

    // =========================================================================
    // [2] 출석체크 & 토스트 & 클립보드
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-400/40',
        gold: 'bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 border-amber-300 font-extrabold',
        error: 'bg-rose-600 text-white border-rose-400/40',
        info: 'bg-slate-800 text-white border-slate-600'
      };
      toast.className = `toast-anim pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border text-sm font-bold ${styles[type] || styles.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 260); }, 2800);
    }

    async function handleAttendance() {
      if (!state.authUser) return openAuthModal();
      const { data, error } = await sb.rpc('check_in_attendance');
      if (error) return showToast(error.message, 'error');
      showToast(data.message, data.success ? 'gold' : 'info');
      const { data: { session } } = await sb.auth.getSession();
      await syncUserSession(session);
    }

    function copyTextFallback(text) {
      navigator.clipboard?.writeText(text).then(() => showToast(`쿠폰번호(${text}) 복사 완료!`, 'success'));
    }
