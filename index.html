<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>표현의 자유 — 토론 재판장 & 일상 커뮤니티</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Noto Serif KR', Georgia, serif;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --header-h: 64px;
      --tabbar-h: 64px;
      --transition: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ================= 테마 1: 토론 재판장 (다크 에디토리얼) ================= */
    body[data-theme="court"] {
      --bg: #0b0e14;
      --bg-elevated: #131823;
      --bg-card: #171d2b;
      --bg-soft: #1f2738;
      --border: #2a3449;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #d4af37;
      --accent-soft: rgba(212, 175, 55, 0.14);
      --accent-text: #111318;
      --pro: #3b82f6;
      --con: #ef4444;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      --hero-bg: radial-gradient(circle at top right, rgba(212,175,55,0.16), transparent 55%), linear-gradient(135deg, #131826 0%, #0b0e14 100%);
    }

    /* ================= 테마 2: 갤러리 (화사하고 밝은 커뮤니티) ================= */
    body[data-theme="gallery"] {
      --bg: #f6f8fc;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-soft: #eef2f9;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #ff5a5f;
      --accent-soft: rgba(255, 90, 95, 0.11);
      --accent-text: #ffffff;
      --pro: #0ea5e9;
      --con: #f43f5e;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --hero-bg: linear-gradient(135deg, #fff1f2 0%, #eff6ff 55%, #ecfdf5 100%);
    }

    /* ================= 테마 3: 소모임 길드 (모던 인디고) ================= */
    body[data-theme="guild"] {
      --bg: #f3f4fa;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-soft: #eaedf8;
      --border: #dde2f0;
      --text: #1e1b4b;
      --text-muted: #636689;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.12);
      --accent-text: #ffffff;
      --pro: #6366f1;
      --con: #ec4899;
      --shadow: 0 10px 26px rgba(49, 46, 129, 0.08);
      --hero-bg: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 60%, #fdf2f8 100%);
    }

    /* ================= 테마 4: 포인트 샵 & 마이페이지 (산뜻한 리워드 톤) ================= */
    body[data-theme="shop"] {
      --bg: #f5fbf9;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-soft: #e6f5ef;
      --border: #d5ece3;
      --text: #0f2922;
      --text-muted: #4b7065;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.13);
      --accent-text: #ffffff;
      --pro: #10b981;
      --con: #f59e0b;
      --shadow: 0 10px 24px rgba(16, 185, 129, 0.09);
      --hero-bg: linear-gradient(135deg, #ecfdf5 0%, #fefce8 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
      padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
    }

    button, input, textarea, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    img, video { max-width: 100%; display: block; }

    /* ================= 헤더 ================= */
    .topbar {
      position: sticky; top: 0; z-index: 90;
      height: var(--header-h);
      background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition), border-color var(--transition);
    }
    .topbar-inner {
      max-width: 1200px; margin: 0 auto; height: 100%;
      padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 1.12rem; letter-spacing: -0.02em;
      cursor: pointer; white-space: nowrap;
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 11px;
      display: grid; place-items: center; font-size: 1.15rem;
      background: var(--accent); color: var(--accent-text);
      box-shadow: 0 4px 12px var(--accent-soft);
      transition: background var(--transition);
    }
    body[data-theme="court"] .brand-title { font-family: var(--font-serif); letter-spacing: 0.02em; }

    .desktop-nav {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-soft); padding: 4px; border-radius: 14px;
      border: 1px solid var(--border);
    }
    .nav-btn {
      padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.92rem;
      color: var(--text-muted); transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active {
      background: var(--accent); color: var(--accent-text);
      box-shadow: 0 3px 10px var(--accent-soft);
    }

    .top-actions { display: flex; align-items: center; gap: 8px; }
    .point-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
      font-weight: 700; font-size: 0.85rem; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border-radius: var(--radius-sm);
      font-weight: 700; font-size: 0.88rem; transition: all 0.18s;
      min-height: 40px; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-soft { background: var(--bg-soft); color: var(--text); border: 1px solid var(--border); }
    .btn-soft:hover { border-color: var(--accent); }
    .btn-pro { background: var(--pro); color: #fff; }
    .btn-con { background: var(--con); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; min-height: 34px; }

    /* ================= 모바일 하단 탭바 ================= */
    .mobile-tabbar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 95;
      background: color-mix(in srgb, var(--bg-elevated) 95%, transparent);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    }
    .mobile-tabbar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
    .m-tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px; border-radius: 12px;
      font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
      min-height: 48px; transition: all 0.18s;
    }
    .m-tab .ico { font-size: 1.25rem; line-height: 1; }
    .m-tab.active { color: var(--accent); background: var(--accent-soft); }

    /* ================= 메인 컨테이너 ================= */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }

    .hero {
      background: var(--hero-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      margin-bottom: 22px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
      box-shadow: var(--shadow);
    }
    .hero h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    body[data-theme="court"] .hero h1 { font-family: var(--font-serif); font-size: 1.65rem; }
    .hero p { color: var(--text-muted); font-size: 0.93rem; max-width: 640px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .subtabs {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .chip {
      padding: 8px 15px; border-radius: 999px; font-size: 0.86rem; font-weight: 700;
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
      transition: all 0.18s; min-height: 38px; display: inline-flex; align-items: center; gap: 5px;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    /* ================= 그리드 & 카드 ================= */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s;
      display: flex; flex-direction: column; gap: 12px;
    }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { transform: translateY(-2px); border-color: var(--accent); }

    .card-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 0.8rem; color: var(--text-muted);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 700;
      background: var(--bg-soft); color: var(--text-muted);
    }
    .badge-accent { background: var(--accent-soft); color: var(--accent); }
    .badge-hot { background: #fff1f2; color: #e11d48; border: 1px solid #fecdd3; }
    .badge-live { background: #ef4444; color: #fff; animation: pulse 1.5s infinite; }
    .badge-closed { background: #334155; color: #e2e8f0; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }

    .card-title { font-size: 1.08rem; font-weight: 800; line-height: 1.38; word-break: keep-all; }
    body[data-theme="court"] .card-title { font-family: var(--font-serif); }
    .card-desc {
      font-size: 0.9rem; color: var(--text-muted);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* 찬반 게이지 바 */
    .vs-bar-wrap { display: flex; flex-direction: column; gap: 6px; }
    .vs-labels { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; }
    .vs-bar {
      height: 10px; border-radius: 999px; overflow: hidden;
      background: var(--bg-soft); display: flex;
    }
    .vs-pro { background: var(--pro); transition: width 0.35s ease; }
    .vs-con { background: var(--con); transition: width 0.35s ease; }

    /* 미디어 프리뷰 */
    .media-box {
      border-radius: 12px; overflow: hidden; background: #0f172a;
      border: 1px solid var(--border); max-height: 320px; display: flex; justify-content: center;
    }
    .media-box img, .media-box video { width: 100%; max-height: 320px; object-fit: cover; }

    /* 라이브 보이스 무대 */
    .voice-stage {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center;
      padding: 18px; border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(239,68,68,0.12));
      border: 1px solid var(--border);
    }
    .seat {
      padding: 16px; border-radius: 14px; background: var(--bg-elevated);
      border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .seat.speaking { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .avatar-circle {
      width: 58px; height: 58px; border-radius: 50%;
      display: grid; place-items: center; font-size: 1.5rem; font-weight: 800;
      background: var(--bg-soft); border: 2px solid var(--border);
    }
    .wave-bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
    .wave-bars span {
      width: 4px; height: 6px; border-radius: 4px; background: var(--accent); transition: height 0.1s;
    }

    /* AI 판결문 박스 */
    .verdict-box {
      border: 1.5px solid var(--accent);
      background: linear-gradient(180deg, var(--accent-soft), transparent 140px), var(--bg-elevated);
      border-radius: var(--radius-md); padding: 18px;
    }
    .verdict-box h3 {
      font-family: var(--font-serif); color: var(--accent);
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 1.1rem;
    }
    .verdict-text { white-space: pre-wrap; font-size: 0.91rem; line-height: 1.7; }

    /* 댓글 & 논거 리스트 */
    .arg-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .arg-item, .comment-item {
      padding: 12px 14px; border-radius: 12px; background: var(--bg-soft);
      border: 1px solid var(--border); font-size: 0.89rem;
    }
    .arg-item.pro { border-left: 4px solid var(--pro); }
    .arg-item.con { border-left: 4px solid var(--con); }

    /* 채팅 박스 */
    .chat-log {
      height: 210px; overflow-y: auto; padding: 12px;
      background: var(--bg-soft); border-radius: 12px; border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .chat-msg { font-size: 0.86rem; }
    .chat-msg strong { color: var(--accent); margin-right: 6px; }

    /* ================= 모달 ================= */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(2, 6, 23, 0.68); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto;
      background: var(--bg-elevated); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .modal-head h2 { font-size: 1.2rem; font-weight: 800; }
    .close-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-soft); color: var(--text); font-size: 1.1rem;
      display: grid; place-items: center;
    }

    /* 폼 요소 */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.84rem; font-weight: 700; color: var(--text-muted); }
    .input, .textarea, .select {
      width: 100%; padding: 11px 13px; border-radius: 10px;
      background: var(--bg-soft); border: 1px solid var(--border);
      color: var(--text); font-size: 0.93rem; outline: none;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
    .textarea { min-height: 110px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* 기프티콘 쿠폰 */
    .coupon-card {
      padding: 14px; border-radius: 14px; border: 1.5px dashed var(--accent);
      background: var(--accent-soft); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .coupon-code {
      font-family: monospace; font-size: 1rem; font-weight: 800; letter-spacing: 0.06em;
      padding: 6px 10px; border-radius: 8px; background: var(--bg-elevated); border: 1px solid var(--border);
    }

    /* 토스트 */
    .toast-wrap {
      position: fixed; top: 76px; right: 16px; z-index: 200;
      display: flex; flex-direction: column; gap: 8px; max-width: 340px;
    }
    .toast {
      padding: 12px 16px; border-radius: 12px;
      background: var(--bg-elevated); color: var(--text);
      border: 1px solid var(--accent); box-shadow: 0 10px 28px rgba(0,0,0,0.28);
      font-size: 0.88rem; font-weight: 600; animation: slideIn 0.25s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    .empty-state {
      text-align: center; padding: 48px 20px; border-radius: var(--radius-md);
      background: var(--bg-card); border: 1px dashed var(--border); color: var(--text-muted);
    }
    .empty-state .big { font-size: 2.2rem; margin-bottom: 8px; }

    /* 플로팅 작성 버튼 (모바일 한 손 조작) */
    .fab {
      display: none; position: fixed; right: 16px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);
      z-index: 92; width: 54px; height: 54px; border-radius: 50%;
      background: var(--accent); color: var(--accent-text);
      font-size: 1.5rem; font-weight: 800; box-shadow: 0 8px 22px rgba(0,0,0,0.3);
      align-items: center; justify-content: center;
    }

    /* ================= 반응형 (모바일 완벽 대응) ================= */
    @media (max-width: 860px) {
      .desktop-nav { display: none; }
      .mobile-tabbar { display: block; }
      .fab { display: flex; }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .topbar-inner { padding: 0 12px; }
      .brand-title { font-size: 1rem; }
      .hide-xs { display: none !important; }
      .container { padding: 14px 12px 30px; }
      .hero { padding: 18px 16px; border-radius: 18px; }
      .hero h1 { font-size: 1.28rem; }
      .grid-2, .grid-3, .arg-columns, .form-row { grid-template-columns: 1fr; }
      .voice-stage { grid-template-columns: 1fr; }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal { border-radius: 22px 22px 0 0; max-height: 92vh; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
      .toast-wrap { left: 12px; right: 12px; max-width: none; }
    }
  </style>
</head>
<body data-theme="court">
  <!-- 상단 네비게이션 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="switchTab('debate')">
        <div class="brand-icon" id="brandIcon">⚖️</div>
        <span class="brand-title">표현의 자유</span>
      </div>

      <nav class="desktop-nav" aria-label="메인 메뉴">
        <button class="nav-btn active" data-tab="debate" onclick="switchTab('debate')">⚖️ 토론장</button>
        <button class="nav-btn" data-tab="gallery" onclick="switchTab('gallery')">✨ 갤러리</button>
        <button class="nav-btn" data-tab="guild" onclick="switchTab('guild')">🛡️ 소모임</button>
        <button class="nav-btn" data-tab="shop" onclick="switchTab('shop')">🎁 포인트샵</button>
      </nav>

      <div class="top-actions" id="topActions">
        <button class="btn btn-primary btn-sm" onclick="openAuthModal()">로그인 / 가입</button>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="container" id="appMain"></main>

  <!-- 모바일 한 손 조작 FAB -->
  <button class="fab" id="mobileFab" onclick="handleFabAction()" title="새 글/토론 작성">＋</button>

  <!-- 모바일 하단 탭바 -->
  <nav class="mobile-tabbar" aria-label="모바일 하단 메뉴">
    <div class="mobile-tabbar-grid">
      <button class="m-tab active" data-tab="debate" onclick="switchTab('debate')"><span class="ico">⚖️</span><span>토론장</span></button>
      <button class="m-tab" data-tab="gallery" onclick="switchTab('gallery')"><span class="ico">✨</span><span>갤러리</span></button>
      <button class="m-tab" data-tab="guild" onclick="switchTab('guild')"><span class="ico">🛡️</span><span>소모임</span></button>
      <button class="m-tab" data-tab="shop" onclick="switchTab('shop')"><span class="ico">🎁</span><span>포인트샵</span></button>
      <button class="m-tab" data-tab="mypage" onclick="switchTab('mypage')"><span class="ico">👤</span><span>마이</span></button>
    </div>
  </nav>

  <!-- 공통 모달 -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- 실시간 알림 토스트 -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    // =========================================================================
    // 1. Supabase 클라이언트 초기화 (제공된 프로젝트 정보 적용)
    // =========================================================================
    const SUPABASE_URL = 'https://fwwjeviebxgaudakqkue.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-T_XVmsB8-xhDP-5sYURTQ_XrUxsIYz';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // =========================================================================
    // 2. 전역 상태 관리
    // =========================================================================
    const state = {
      user: null,
      profile: null,
      activeTab: 'debate',       // 'debate' | 'gallery' | 'guild' | 'shop' | 'mypage'
      debateSubTab: 'text',      // 'text' | 'voice'
      galleryBoard: 'all',       // 'all' | 'hot' | 'humor' | 'free' | 'politics'
      guildCategory: 'all',      // 'all' | 'debate' | 'hobby'
      debates: [],
      liveRooms: [],
      posts: [],
      guilds: [],
      shopItems: [],
      openDebateId: null,
      openPostId: null,
      openGuildId: null,
      openLiveRoomId: null,
      // WebRTC & Live Voice 상태
      liveChannel: null,
      localStream: null,
      peerConn: null,
      audioAnalyser: null,
      waveRaf: null,
      liveChats: []
    };

    // 유틸리티
    const esc = (s = '') => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    const fmtDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    };
    const timeRemaining = (deadline) => {
      const diff = new Date(deadline).getTime() - Date.now();
      if (diff <= 0) return '마감 종료';
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return h > 0 ? `${h}시간 ${m}분 남음` : `${m}분 남음`;
    };
    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.getElementById('toastWrap').appendChild(el);
      setTimeout(() => el.remove(), 3400);
    }
    function requireAuth() {
      if (!state.user) {
        toast('로그인이 필요한 기능입니다.');
        openAuthModal();
        return false;
      }
      return true;
    }

    // =========================================================================
    // 3. 테마 & 네비게이션 전환
    // =========================================================================
    const TAB_META = {
      debate: { theme: 'court', icon: '⚖️' },
      gallery: { theme: 'gallery', icon: '✨' },
      guild: { theme: 'guild', icon: '🛡️' },
      shop: { theme: 'shop', icon: '🎁' },
      mypage: { theme: 'shop', icon: '👤' }
    };

    function switchTab(tab) {
      state.activeTab = tab;
      const meta = TAB_META[tab] || TAB_META.debate;
      document.body.setAttribute('data-theme', meta.theme);
      document.getElementById('brandIcon').textContent = meta.icon;

      document.querySelectorAll('.nav-btn, .m-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      const fab = document.getElementById('mobileFab');
      fab.style.display = (tab === 'shop' || tab === 'mypage') ? 'none' : '';
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleFabAction() {
      if (state.activeTab === 'debate') {
        state.debateSubTab === 'voice' ? openCreateLiveModal() : openCreateDebateModal();
      } else if (state.activeTab === 'gallery') {
        openCreatePostModal();
      } else if (state.activeTab === 'guild') {
        openCreateGuildModal();
      }
    }

    // =========================================================================
    // 4. 인증 (Supabase Auth: 이메일 + 소셜 로그인)
    // =========================================================================
    async function syncSession() {
      const { data: { session } } = await sb.auth.getSession();
      state.user = session?.user || null;
      if (state.user) {
        await loadMyProfile();
      } else {
        state.profile = null;
      }
      renderTopActions();
    }

    async function loadMyProfile() {
      if (!state.user) return;
      let { data, error } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle();
      if (!data && !error) {
        const nick = state.user.user_metadata?.nickname || state.user.email?.split('@')[0] || '시민';
        const res = await sb.from('profiles').insert({ id: state.user.id, nickname: nick, points: 500 }).select().single();
        data = res.data;
      }
      state.profile = data;
      renderTopActions();
    }

    function renderTopActions() {
      const box = document.getElementById('topActions');
      if (!state.user || !state.profile) {
        box.innerHTML = `<button class="btn btn-primary btn-sm" onclick="openAuthModal()">로그인 / 가입</button>`;
        return;
      }
      box.innerHTML = `
        <button class="point-pill" onclick="switchTab('mypage')" title="내 포인트 & 출석체크">
          🪙 <span>${(state.profile.points || 0).toLocaleString()}P</span>
        </button>
        <button class="btn btn-soft btn-sm hide-xs" onclick="doDailyCheckin()">📅 출석</button>
        <button class="btn btn-soft btn-sm hide-xs" onclick="switchTab('mypage')">👤 ${esc(state.profile.nickname)}</button>
      `;
    }

    function openAuthModal(mode = 'login') {
      openModal(`
        <div class="modal-head">
          <h2>${mode === 'login' ? '로그인' : '회원가입 (+500P 지급)'}</h2>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="subtabs" style="margin-bottom:0">
          <button class="chip ${mode === 'login' ? 'active' : ''}" onclick="openAuthModal('login')">로그인</button>
          <button class="chip ${mode === 'signup' ? 'active' : ''}" onclick="openAuthModal('signup')">회원가입</button>
        </div>
        <form onsubmit="submitAuth(event, '${mode}')" style="display:flex;flex-direction:column;gap:12px">
          ${mode === 'signup' ? `
            <div class="field">
              <label>닉네임</label>
              <input class="input" id="authNick" required placeholder="커뮤니티에서 사용할 닉네임" maxlength="20" />
            </div>` : ''}
          <div class="field">
            <label>이메일</label>
            <input class="input" id="authEmail" type="email" required placeholder="name@example.com" />
          </div>
          <div class="field">
            <label>비밀번호 (6자 이상)</label>
            <input class="input" id="authPw" type="password" required minlength="6" placeholder="••••••••" />
          </div>
          <button class="btn btn-primary" type="submit">${mode === 'login' ? '이메일로 로그인' : '회원가입 완료'}</button>
        </form>
        <div style="text-align:center;font-size:0.82rem;color:var(--text-muted);margin:2px 0">또는 소셜 계정으로 3초 시작</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <button class="btn btn-soft btn-sm" onclick="socialLogin('google')">Google</button>
          <button class="btn btn-soft btn-sm" onclick="socialLogin('kakao')">Kakao</button>
          <button class="btn btn-soft btn-sm" onclick="socialLogin('github')">GitHub</button>
        </div>
      `);
    }

    async function submitAuth(e, mode) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPw').value;
      if (mode === 'signup') {
        const nickname = document.getElementById('authNick').value.trim();
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { nickname } } });
        if (error) return toast('가입 오류: ' + error.message);
        if (!data.session) {
          toast('가입 요청 완료! 이메일 인증 메일을 확인하거나 Supabase Confirm Email을 꺼주세요.');
        } else {
          toast('회원가입 완료! 환영 포인트 +500P가 지급되었습니다.');
        }
        closeModal();
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) return toast('로그인 실패: ' + error.message);
        toast('로그인되었습니다.');
        closeModal();
      }
    }

    async function socialLogin(provider) {
      const { error } = await sb.auth.signInWithOAuth({
        provider,
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) toast('소셜 로그인 설정 필요: ' + error.message);
    }

    async function logout() {
      await sb.auth.signOut();
      state.user = null;
      state.profile = null;
      renderTopActions();
      toast('로그아웃되었습니다.');
      renderCurrentTab();
    }

    async function doDailyCheckin() {
      if (!requireAuth()) return;
      const { data, error } = await sb.rpc('daily_checkin');
      if (error) return toast('출석 오류: ' + error.message);
      toast(data.message);
      await loadMyProfile();
      if (state.activeTab === 'mypage') renderMyPage();
    }

    // =========================================================================
    // 5. 데이터 로더 & Realtime 실시간 구독
    // =========================================================================
    async function loadAllData() {
      await Promise.all([loadDebates(), loadLiveRooms(), loadPosts(), loadGuilds(), loadShopItems()]);
      renderCurrentTab();
    }

    async function loadDebates() {
      const { data } = await sb.from('debates').select('*, debate_votes(side), debate_arguments(id)').order('created_at', { ascending: false });
      state.debates = data || [];
    }

    async function loadLiveRooms() {
      const { data } = await sb.from('live_rooms').select('*').eq('is_live', true).order('created_at', { ascending: false });
      state.liveRooms = data || [];
    }

    async function loadPosts() {
      const { data } = await sb.from('posts').select('*, post_comments(id)').order('created_at', { ascending: false });
      state.posts = data || [];
    }

    async function loadGuilds() {
      const { data } = await sb.from('guilds').select('*, guild_members(user_id, status)').order('activity_score', { ascending: false });
      state.guilds = data || [];
    }

    async function loadShopItems() {
      const { data } = await sb.from('shop_items').select('*').order('price', { ascending: true });
      state.shopItems = data || [];
    }

    function setupRealtime() {
      sb.channel('global-platform-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'debates' }, async (p) => {
          await loadDebates();
          if (state.activeTab === 'debate') renderDebateTab();
          if (state.openDebateId) openDebateDetail(state.openDebateId, true);
          if (p.eventType === 'INSERT') toast('⚖️ 새 토론 안건이 상정되었습니다.');
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'debate_arguments' }, async (p) => {
          await loadDebates();
          if (state.activeTab === 'debate') renderDebateTab();
          if (state.openDebateId && p.new?.debate_id === state.openDebateId) openDebateDetail(state.openDebateId, true);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'debate_votes' }, async () => {
          await loadDebates();
          if (state.activeTab === 'debate') renderDebateTab();
          if (state.openDebateId) openDebateDetail(state.openDebateId, true);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'live_rooms' }, async () => {
          await loadLiveRooms();
          if (state.activeTab === 'debate' && state.debateSubTab === 'voice') renderDebateTab();
          if (state.openLiveRoomId) refreshLiveRoomHeader(state.openLiveRoomId);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, async (p) => {
          await loadPosts();
          if (state.activeTab === 'gallery') renderGalleryTab();
          if (state.openPostId) openPostDetail(state.openPostId, true);
          if (p.eventType === 'INSERT') toast('✨ 갤러리에 새 글이 올라왔습니다.');
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'post_comments' }, async (p) => {
          await loadPosts();
          if (state.activeTab === 'gallery') renderGalleryTab();
          if (state.openPostId && p.new?.post_id === state.openPostId) openPostDetail(state.openPostId, true);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'guilds' }, async () => {
          await loadGuilds();
          if (state.activeTab === 'guild') renderGuildTab();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'guild_posts' }, async (p) => {
          if (state.openGuildId && p.new?.guild_id === state.openGuildId) openGuildDetail(state.openGuildId, true);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'guild_events' }, async (p) => {
          if (state.openGuildId && p.new?.guild_id === state.openGuildId) openGuildDetail(state.openGuildId, true);
        })
        .subscribe();
    }

    // =========================================================================
    // 6. 메인 렌더링 라우터
    // =========================================================================
    function renderCurrentTab() {
      if (state.activeTab === 'debate') renderDebateTab();
      else if (state.activeTab === 'gallery') renderGalleryTab();
      else if (state.activeTab === 'guild') renderGuildTab();
      else if (state.activeTab === 'shop') renderShopTab();
      else if (state.activeTab === 'mypage') renderMyPage();
    }

    // =========================================================================
    // 7. [탭 1] 토론장 (다크 재판장 콘셉트 — 텍스트 토론/AI 판결 + 1:1 라이브 보이스)
    // =========================================================================
    function renderDebateTab() {
      const main = document.getElementById('appMain');
      main.innerHTML = `
        <section class="hero">
          <div>
            <h1>⚖️ 표현의 자유 대법정</h1>
            <p>논리와 근거로 맞붙는 정통 텍스트 마감 토론(AI 판사 최종 선고)과 실시간 1:1 라이브 보이스 대결이 펼쳐집니다.</p>
          </div>
          <div class="hero-actions">
            <button class="btn btn-primary" onclick="openCreateDebateModal()">⚖️ 텍스트 토론 발제 (+50P)</button>
            <button class="btn btn-soft" onclick="openCreateLiveModal()">🎙️ 1:1 보이스 방 개설</button>
          </div>
        </section>

        <div class="subtabs">
          <button class="chip ${state.debateSubTab === 'text' ? 'active' : ''}" onclick="state.debateSubTab='text';renderDebateTab()">📜 텍스트 마감 토론 (${state.debates.length})</button>
          <button class="chip ${state.debateSubTab === 'voice' ? 'active' : ''}" onclick="state.debateSubTab='voice';renderDebateTab()">🎙️ 1:1 라이브 보이스 (${state.liveRooms.length})</button>
        </div>

        <div id="debateContent"></div>
      `;

      const box = document.getElementById('debateContent');
      if (state.debateSubTab === 'text') {
        if (!state.debates.length) {
          box.innerHTML = `<div class="empty-state"><div class="big">⚖️</div>아직 상정된 토론 안건이 없습니다. 첫 안건을 발제해 +50P를 받아보세요!</div>`;
          return;
        }
        box.innerHTML = `<div class="grid-2">${state.debates.map(d => {
          const votes = d.debate_votes || [];
          const pro = votes.filter(v => v.side === 'pro').length;
          const con = votes.filter(v => v.side === 'con').length;
          const total = pro + con || 1;
          const proPct = Math.round((pro / total) * 100);
          const conPct = votes.length ? 100 - proPct : 50;
          const isClosed = d.status === 'closed';
          return `
            <article class="card clickable" onclick="openDebateDetail('${d.id}')">
              <div class="card-meta">
                <span class="badge ${isClosed ? 'badge-closed' : 'badge-accent'}">
                  ${isClosed ? `🏛️ 판결 완료 (${d.winner === 'pro' ? d.pro_label : d.winner === 'con' ? d.con_label : '무승부'})` : `⏳ ${timeRemaining(d.deadline)}`}
                </span>
                <span>발제: ${esc(d.author_name)} · 논거 ${(d.debate_arguments || []).length}건</span>
              </div>
              <h3 class="card-title">${esc(d.title)}</h3>
              <p class="card-desc">${esc(d.description)}</p>
              <div class="vs-bar-wrap">
                <div class="vs-labels">
                  <span style="color:var(--pro)">${esc(d.pro_label)} ${votes.length ? proPct : 50}% (${pro})</span>
                  <span style="color:var(--con)">${esc(d.con_label)} ${votes.length ? conPct : 50}% (${con})</span>
                </div>
                <div class="vs-bar">
                  <div class="vs-pro" style="width:${votes.length ? proPct : 50}%"></div>
                  <div class="vs-con" style="width:${votes.length ? conPct : 50}%"></div>
                </div>
              </div>
            </article>
          `;
        }).join('')}</div>`;
      } else {
        if (!state.liveRooms.length) {
          box.innerHTML = `<div class="empty-state"><div class="big">🎙️</div>현재 진행 중인 1:1 보이스 대결방이 없습니다. 직접 라이브 무대를 열어보세요!</div>`;
          return;
        }
        box.innerHTML = `<div class="grid-2">${state.liveRooms.map(r => {
          const total = (r.pro_cheers + r.con_cheers) || 1;
          const proPct = Math.round(((r.pro_cheers || 0) / total) * 100);
          return `
            <article class="card clickable" onclick="openLiveRoom('${r.id}')">
              <div class="card-meta">
                <span class="badge badge-live">● LIVE 1:1 VOICE</span>
                <span>응원 합계 ${r.pro_cheers + r.con_cheers}회</span>
              </div>
              <h3 class="card-title">${esc(r.title)}</h3>
              <div style="display:flex;justify-content:space-between;gap:8px;font-size:0.86rem;background:var(--bg-soft);padding:10px 12px;border-radius:10px">
                <div><strong style="color:var(--pro)">[${esc(r.pro_label)}]</strong> ${esc(r.pro_speaker_name || '도전자 대기중')}</div>
                <div>VS</div>
                <div><strong style="color:var(--con)">[${esc(r.con_label)}]</strong> ${esc(r.con_speaker_name || '도전자 대기중')}</div>
              </div>
              <div class="vs-bar">
                <div class="vs-pro" style="width:${(r.pro_cheers + r.con_cheers) ? proPct : 50}%"></div>
                <div class="vs-con" style="width:${(r.pro_cheers + r.con_cheers) ? 100 - proPct : 50}%"></div>
              </div>
              <button class="btn btn-primary btn-sm">🎧 라이브 방 입장 (관전 · 1:1 대결)</button>
            </article>
          `;
        }).join('')}</div>`;
      }
    }

    function openCreateDebateModal() {
      if (!requireAuth()) return;
      openModal(`
        <div class="modal-head">
          <h2>⚖️ 새 텍스트 토론 안건 상정</h2>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="submitCreateDebate(event)" style="display:flex;flex-direction:column;gap:12px">
          <div class="field">
            <label>토론 주제</label>
            <input class="input" id="dbTitle" required placeholder="예: AI 생성 콘텐츠에 저작권을 인정해야 하는가?" />
          </div>
          <div class="form-row">
            <div class="field">
              <label>찬성 측 입장명</label>
              <input class="input" id="dbPro" required value="찬성" />
            </div>
            <div class="field">
              <label>반대 측 입장명</label>
              <input class="input" id="dbCon" required value="반대" />
            </div>
          </div>
          <div class="field">
            <label>마감 기한</label>
            <select class="select" id="dbHours">
              <option value="1">1시간 후 마감</option>
              <option value="6">6시간 후 마감</option>
              <option value="24" selected>24시간 후 마감</option>
              <option value="72">3일 후 마감</option>
            </select>
          </div>
          <div class="field">
            <label>안건 배경 및 핵심 쟁점</label>
            <textarea class="textarea" id="dbDesc" required placeholder="토론 참가자들이 참고할 사실관계와 쟁점을 정리해 주세요."></textarea>
          </div>
          <button class="btn btn-primary" type="submit">안건 상정 및 +50P 적립</button>
        </form>
      `);
    }

    async function submitCreateDebate(e) {
      e.preventDefault();
      const hours = Number(document.getElementById('dbHours').value);
      const deadline = new Date(Date.now() + hours * 3600000).toISOString();
      const { error } = await sb.from('debates').insert({
        author_id: state.user.id,
        author_name: state.profile.nickname,
        title: document.getElementById('dbTitle').value.trim(),
        pro_label: document.getElementById('dbPro').value.trim(),
        con_label: document.getElementById('dbCon').value.trim(),
        description: document.getElementById('dbDesc').value.trim(),
        deadline
      });
      if (error) return toast('토론 생성 실패: ' + error.message);
      await sb.rpc('award_points', { p_amount: 50, p_reason: '토론 안건 발제' });
      await loadMyProfile();
      closeModal();
      toast('⚖️ 토론이 상정되었습니다! (+50P)');
    }

    async function openDebateDetail(debateId, isRefresh = false) {
      state.openDebateId = debateId;
      const [{ data: debate }, { data: args }, { data: votes }] = await Promise.all([
        sb.from('debates').select('*').eq('id', debateId).single(),

      const proArgs = (args || []).filter(a => a.side === 'pro');

          <div style="display:flex;gap:8px;flex-wrap:wrap">

            <button class="btn btn-con btn-sm" style="flex:1" onclick="voteDebate('${debate.id}','con')">👎 ${esc(debate.con_label)} 투표</button>
            <button class="btn btn-primary btn-sm" onclick="runAiJudge('${debate.id}')">🤖 ${isExpired ? 'AI 판사 최종 판결' : '조기 마감 & AI 판결'}</button>
          </div>
        ` : `
          <div class="verdict-box">
            <h3>🤖 AI 대법관 최종 판결문 — 승자: ${debate.winner === 'pro' ? esc(debate.pro_label) : debate.winner === 'con' ? esc(debate.con_label) : '무승부'}</h3>
            <div class="verdict-text">${esc(debate.ai_verdict)}</div>
          </div>

        <div class="arg-columns">
          <div style="display:flex;flex-direction:column;gap:8px">

        ${!isClosed ? `

    // AI 판결 엔진 (양측 실제 논거·근거 키워드·구체성·배심원 투표 종합 분석 + 선택적 Gemini API 연동)
    async function runAiJudge(debateId) {
      if (!requireAuth()) return;
      toast('🤖 AI 대법관이 양측 논리와 근거를 정밀 심리 중입니다...');

      const [{ data: debate }, { data: args }, { data: votes }] = await Promise.all([
        sb.from('debates').select('*').eq('id', debateId).single(),
        sb.from('debate_arguments').select('*').eq('debate_id', debateId),
        sb.from('debate_votes').select('*').eq('debate_id', debateId)
      ]);
      const proArgs = (args || []).filter(a => a.side === 'pro');
      const conArgs = (args || []).filter(a => a.side === 'con');
      const proVotes = (votes || []).filter(v => v.side === 'pro').length;
      const conVotes = (votes || []).filter(v => v.side === 'con').length;

      // 논거 점수 계산 (논거 수, 평균 상세도, 근거 키워드 포함도, 배심원 투표)
      const evidenceRegex = /(통계|사례|법|헌법|데이터|연구|비용|권리|책임|때문|근거|비율|%|현실|원칙)/g;
      const scoreSide = (list, vCount) => {
        const lenScore = list.reduce((s, a) => s + Math.min(35, a.content.length * 0.4), 0);
        const kwScore = list.reduce((s, a) => s + ((a.content.match(evidenceRegex) || []).length * 8), 0);
        return Math.round(lenScore + kwScore + list.length * 14 + vCount * 10);
      };
      const proScore = scoreSide(proArgs, proVotes);
      const conScore = scoreSide(conArgs, conVotes);
      let winner = proScore > conScore ? 'pro' : conScore > proScore ? 'con' : 'draw';

      const summarize = (list) => list.length
        ? list.slice(0, 3).map((a, i) => `  ${i + 1}) "${a.content.slice(0, 90)}${a.content.length > 90 ? '...' : ''}" — ${a.author_name}`).join('\n')
        : '  (제출된 구체적 변론이 없습니다.)';

      let verdict = `[사건명] ${debate.title}\n` +
        `[심리 결과] ${debate.pro_label}(${proScore}점 / 배심원 ${proVotes}표) vs ${debate.con_label}(${conScore}점 / 배심원 ${conVotes}표)\n\n` +
        `1. ${debate.pro_label} 측 핵심 논지 요약 (${proArgs.length}건)\n${summarize(proArgs)}\n\n` +
        `2. ${debate.con_label} 측 핵심 논지 요약 (${conArgs.length}건)\n${summarize(conArgs)}\n\n` +
        `3. 재판부 판단 및 선고\n` +
        (winner === 'draw'
          ? `양측의 논리적 밀도와 시민 배심원의 지지가 팽팽하게 균형을 이루었습니다. 본 재판부는 어느 일방의 우위를 단정하기 어렵다고 판단하여 '무승부(추가 논의 권고)'를 선고합니다.`
          : `제출된 변론의 구체성, 근거 제시 빈도 및 시민 배심원의 공감을 종합 심리한 결과, '${winner === 'pro' ? debate.pro_label : debate.con_label}' 측이 보다 설득력 있는 논거 구조를 제시하였습니다. 이에 본 재판부는 '${winner === 'pro' ? debate.pro_label : debate.con_label}' 측의 승소를 선고합니다.`);

      // 사용자가 마이페이지에 Gemini API Key를 저장해 둔 경우 실제 LLM 판결문 생성
      const userGeminiKey = localStorage.getItem('freedom_gemini_key');
      if (userGeminiKey) {
        try {
          const prompt = `당신은 공정한 AI 대법관입니다. 토론 주제 "${debate.title}"에 대해 찬성(${debate.pro_label}) 논거: ${JSON.stringify(proArgs.map(a=>a.content))}, 반대(${debate.con_label}) 논거: ${JSON.stringify(conArgs.map(a=>a.content))}, 투표(${proVotes}:${conVotes})를 바탕으로 양측 논리를 요약하고 최종 승자와 품격 있는 판결문을 한국어로 12줄 이내로 작성하세요.`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(userGeminiKey)}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const json = await res.json();
          const llmText = json?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (llmText) verdict = llmText;
        } catch (_) {}
      }

      const { error } = await sb.from('debates').update({ status: 'closed', winner, ai_verdict: verdict }).eq('id', debateId);
      if (error) return toast('판결 저장 오류: ' + error.message);
      toast('⚖️ AI 대법관 최종 판결이 선고되었습니다!');
    }

    async function toggleMic(roomId, seatHint = 'pro') {
      if (state.localStream) {
        state.localStream.getTracks().forEach(t => t.stop());
        state.localStream = null;
        if (state.waveRaf) cancelAnimationFrame(state.waveRaf);
        const btn = document.getElementById('micToggleBtn');
        if (btn) btn.textContent = '🔇 마이크 연결 (음성 송출)';
        toast('마이크를 껐습니다.');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.localStream = stream;
        const btn = document.getElementById('micToggleBtn');
        if (btn) btn.textContent = '🟢 마이크 ON (실시간 음성 송출 중)';
        toast('🎙️ 마이크가 연결되었습니다. 실시간 음성 송출을 시작합니다.');

        // 오디오 파형 시각화
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 32;
        src.connect(analyser);
        const arr = new Uint8Array(analyser.frequencyBinCount);
        const bars = document.querySelectorAll(`#${seatHint === 'con' ? 'waveCon' : 'wavePro'} span`);
        const loop = () => {
          if (!state.localStream) return;
          analyser.getByteFrequencyData(arr);
          bars.forEach((b, i) => { b.style.height = Math.max(5, Math.min(22, arr[i] / 9)) + 'px'; });
          state.waveRaf = requestAnimationFrame(loop);
        };
        loop();

        // WebRTC PeerConnection Offer 송신
        const pc = createPeerConn();
        stream.getTracks().forEach(t => pc.addTrack(t, stream));
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        state.liveChannel?.send({
          type: 'broadcast', event: 'rtc',
          payload: { from: state.user?.id || 'guest', type: 'offer', sdp: offer }
        });
      } catch (err) {
        toast('마이크 권한을 허용해 주세요: ' + err.message);
      }
    }

    function createPeerConn() {
      if (state.peerConn) state.peerConn.close();
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      pc.onicecandidate = (e) => {
        if (e.candidate) {
          state.liveChannel?.send({
            type: 'broadcast', event: 'rtc',
            payload: { from: state.user?.id || 'guest', type: 'ice', candidate: e.candidate }
          });
        }
      };
      pc.ontrack = (e) => {
        const audio = document.getElementById('remoteAudio');
        if (audio) audio.srcObject = e.streams[0];
      };
      state.peerConn = pc;
      return pc;
    }

    async function handleRtcSignal(payload) {
      try {
        if (payload.type === 'offer') {
          const pc = createPeerConn();
          if (state.localStream) state.localStream.getTracks().forEach(t => pc.addTrack(t, state.localStream));
          await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
          const ans = await pc.createAnswer();
          await pc.setLocalDescription(ans);
          state.liveChannel?.send({
            type: 'broadcast', event: 'rtc',
            payload: { from: state.user?.id || 'guest', type: 'answer', sdp: ans }
          });
        } else if (payload.type === 'answer' && state.peerConn) {
          await state.peerConn.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        } else if (payload.type === 'ice' && state.peerConn && payload.candidate) {
          await state.peerConn.addIceCandidate(new RTCIceCandidate(payload.candidate));
        }
      } catch (_) {}
    }

      await sb.rpc('cheer_live_room', { p_room_id: roomId, p_side: side });
      state.liveChannel?.send({
        type: 'broadcast', event: 'chat',
        payload: { user: '🔥 응원', text: `${state.profile?.nickname || '관전자'}님이 ${side === 'pro' ? '찬성' : '반대'} 측을 응원했습니다!` }
      });
    }

      state.liveChannel?.send({

      });

      if (state.localStream) { state.localStream.getTracks().forEach(t => t.stop()); state.localStream = null; }

    async function submitCreatePost(e) {
      e.preventDefault();
      const btn = document.getElementById('postSubmitBtn');
      btn.disabled = true; btn.textContent = '업로드 중...';

      let mediaUrl = null, mediaType = null;
      const file = document.getElementById('postFile').files[0];
      if (file) {
        mediaType = file.type.startsWith('video') ? 'video' : 'image';
        const ext = file.name.split('.').pop();
        const path = `${state.user.id}/${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from('community-media').upload(path, file);
        if (upErr) {
          btn.disabled = false; btn.textContent = '게시글 등록 (+30P)';
          return toast('미디어 업로드 실패 (Storage 버킷 확인 필요): ' + upErr.message);
        }
        const { data: pub } = sb.storage.from('community-media').getPublicUrl(path);
        mediaUrl = pub.publicUrl;
      }

      const { error } = await sb.from('posts').insert({
        board: document.getElementById('postBoard').value,
        author_id: state.user.id,
        author_name: state.profile.nickname,
        title: document.getElementById('postTitle').value.trim(),
        content: document.getElementById('postContent').value.trim(),
        media_url: mediaUrl,
        media_type: mediaType
      });
      if (error) {
        btn.disabled = false; btn.textContent = '게시글 등록 (+30P)';
        return toast('글 작성 실패: ' + error.message);
      }
      await sb.rpc('award_points', { p_amount: 30, p_reason: '갤러리 게시글 작성' });
      await loadMyProfile();
      closeModal();
      toast('✨ 게시글이 등록되었습니다! (+30P)');
    }

        </div>

        <!-- 소모임 전용 게시판 -->
        <div style="display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--border)">
          <strong>📋 길드 전용 게시판 (${(gPosts || []).length})</strong>
          ${isJoined ? `
            <form onsubmit="submitGuildPost(event,'${guild.id}')" style="display:flex;gap:8px">
              <input class="input" id="gpContent" required placeholder="길드원들과 나눌 소식을 적어주세요 (+길드 활동도 15)" />
              <button class="btn btn-primary btn-sm" type="submit">게시</button>
            </form>
          ` : '<div style="font-size:0.83rem;color:var(--text-muted)">길드에 가입하면 전용 게시판과 일정 등록을 이용할 수 있습니다.</div>'}
          ${(gPosts || []).map(p => `
            <div class="comment-item">
              <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:3px"><strong>${esc(p.author_name)}</strong> · ${fmtDate(p.created_at)}</div>
              <div>${esc(p.content)}</div>
            </div>
          `).join('')}
        </div>
      `;
      isRefresh ? (document.getElementById('modalBox').innerHTML = html) : openModal(html);
    }

    async function joinGuild(guildId) {
      if (!requireAuth()) return;
      const { error } = await sb.from('guild_members').insert({
        guild_id: guildId, user_id: state.user.id, user_name: state.profile.nickname, role: 'member', status: 'approved'
      });
      if (error) return toast('가입 오류: ' + error.message);
      const g = state.guilds.find(x => x.id === guildId);
      if (g) await sb.from('guilds').update({ activity_score: g.activity_score + 20 }).eq('id', guildId);
      await loadGuilds();
      toast('🛡️ 길드에 가입되었습니다!');
      openGuildDetail(guildId, true);
    }

    async function submitGuildPost(e, guildId) {
      e.preventDefault();
      const input = document.getElementById('gpContent');
      const { error } = await sb.from('guild_posts').insert({
        guild_id: guildId, author_id: state.user.id, author_name: state.profile.nickname, content: input.value.trim()
      });
      if (error) return toast('작성 오류: ' + error.message);
      const g = state.guilds.find(x => x.id === guildId);
      if (g) await sb.from('guilds').update({ activity_score: g.activity_score + 15 }).eq('id', guildId);
      input.value = '';
      toast('길드 게시물이 등록되었습니다! (길드 활동도 +15)');
    }

    async function submitGuildEvent(e, guildId) {
      e.preventDefault();
      const { error } = await sb.from('guild_events').insert({
        guild_id: guildId,
        creator_id: state.user.id,
        title: document.getElementById('geTitle').value.trim(),
        event_date: new Date(document.getElementById('geDate').value).toISOString(),
        location: '길드 온라인 라운지'
      });
      if (error) return toast('일정 등록 오류: ' + error.message);
      toast('📅 모임 일정이 등록되었습니다!');
    }

    async function attendGuildEvent(eventId, curCount, guildId) {
      if (!requireAuth()) return;
      await sb.from('guild_events').update({ attendees_count: curCount + 1 }).eq('id', eventId);
      toast('🙋 모임 참석을 완료했습니다!');
      openGuildDetail(guildId, true);
    }

    // =========================================================================
    // 11. [탭 4] 포인트 샵 (기프티콘 교환소)
    // =========================================================================
    function renderShopTab() {
      const main = document.getElementById('appMain');
      const pts = state.profile ? state.profile.points : 0;
      main.innerHTML = `
        <section class="hero">
          <div>
            <h1>🎁 포인트 샵 (기프티콘 교환소)</h1>
            <p>출석(+100P) · 토론 발제(+50P) · 글쓰기(+30P) · 댓글(+10P) · <strong>핫이슈 보너스(+300P)</strong>로 모은 포인트를 실제 기프티콘 쿠폰으로 교환하세요.</p>
          </div>
          <div class="hero-actions">
            ${state.user ? `
              <button class="btn btn-primary" onclick="doDailyCheckin()">📅 오늘 출석체크 (+100P)</button>
              <button class="btn btn-soft" onclick="switchTab('mypage')">🪙 보유 ${pts.toLocaleString()}P · 쿠폰함</button>
            ` : `<button class="btn btn-primary" onclick="openAuthModal()">로그인하고 500P 받기</button>`}
          </div>
        </section>

        <div class="grid-3">
          ${state.shopItems.map(item => `
            <article class="card">
              <div class="card-meta">
                <span class="badge badge-accent">${esc(item.brand)}</span>
                <span class="badge">${esc(item.category)}</span>
              </div>
              <div style="font-size:2.6rem;text-align:center;padding:12px 0;background:var(--bg-soft);border-radius:12px">${esc(item.icon)}</div>
              <div>
                <h3 class="card-title">${esc(item.name)}</h3>
                <p style="font-size:0.84rem;color:var(--text-muted);margin-top:4px">${esc(item.description || '')}</p>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--border)">
                <strong style="font-size:1.1rem;color:var(--accent)">${item.price.toLocaleString()} P</strong>
                <button class="btn btn-primary btn-sm" onclick="redeemItem('${item.id}','${esc(item.name)}',${item.price})">교환하기</button>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    async function redeemItem(itemId, name, price) {
      if (!requireAuth()) return;
      if (!confirm(`[${name}] 상품을 ${price.toLocaleString()}P로 교환하시겠습니까?`)) return;
      const { data, error } = await sb.rpc('redeem_shop_item', { p_item_id: itemId });
      if (error) return toast('교환 오류: ' + error.message);
      if (!data.ok) return toast(data.message);
      await loadMyProfile();
      toast(`🎉 교환 완료! 쿠폰번호: ${data.coupon_code}`);
      renderShopTab();
    }

    // =========================================================================
    // 12. [탭 5] 마이페이지 (포인트 적립/사용 내역, 기프티콘 보관함, AI 키 설정)
    // =========================================================================
    async function renderMyPage() {
      const main = document.getElementById('appMain');
      if (!state.user || !state.profile) {
        main.innerHTML = `
          <div class="empty-state">
            <div class="big">👤</div>
            <h2 style="margin-bottom:8px">로그인이 필요합니다</h2>
            <p style="margin-bottom:16px">가입 즉시 500P가 지급되며, 포인트 적립 내역과 기프티콘 쿠폰함을 관리할 수 있습니다.</p>
            <button class="btn btn-primary" onclick="openAuthModal()">로그인 / 회원가입</button>
          </div>`;
        return;
      }

      const [{ data: logs }, { data: coupons }] = await Promise.all([
        sb.from('point_logs').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false }).limit(30),
        sb.from('redemptions').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false })
      ]);

      const savedKey = localStorage.getItem('freedom_gemini_key') || '';

      main.innerHTML = `
        <section class="hero">
          <div>
            <h1>👤 ${esc(state.profile.nickname)}님의 마이페이지</h1>
            <p>이메일: ${esc(state.user.email || '소셜 계정')} · 현재 보유 포인트: <strong style="color:var(--accent);font-size:1.15rem">${state.profile.points.toLocaleString()} P</strong></p>
          </div>
          <div class="hero-actions">
            <button class="btn btn-primary" onclick="doDailyCheckin()">📅 출석체크 (+100P)</button>
            <button class="btn btn-soft" onclick="logout()">로그아웃</button>
          </div>
        </section>

        <div class="grid-2">
          <div class="card">
            <h3 class="card-title">🎟️ 내 기프티콘 보관함 (${(coupons || []).length})</h3>
            ${(coupons || []).length ? coupons.map(c => `
              <div class="coupon-card">
                <div>
                  <div style="font-size:0.78rem;color:var(--text-muted)">${esc(c.brand)} · ${fmtDate(c.created_at)}</div>
                  <strong>${esc(c.item_name)}</strong>
                </div>
                <div class="coupon-code">${esc(c.coupon_code)}</div>
              </div>
            `).join('') : '<div style="font-size:0.88rem;color:var(--text-muted)">아직 교환한 기프티콘이 없습니다. 포인트 샵을 둘러보세요!</div>'}
          </div>

          <div class="card">
            <h3 class="card-title">📊 포인트 적립 · 사용 내역</h3>
            <div style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto">
              ${(logs || []).map(l => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-soft);border-radius:10px;font-size:0.88rem">
                  <div>
                    <div style="font-weight:700">${esc(l.reason)}</div>
                    <div style="font-size:0.76rem;color:var(--text-muted)">${fmtDate(l.created_at)}</div>
                  </div>
                  <strong style="color:${l.amount >= 0 ? 'var(--pro)' : 'var(--con)'}">${l.amount >= 0 ? '+' : ''}${l.amount.toLocaleString()}P</strong>
                </div>
              `).join('') || '<div style="font-size:0.88rem;color:var(--text-muted)">내역이 없습니다.</div>'}
            </div>
          </div>
        </div>

        <div class="card" style="margin-top:16px">
          <h3 class="card-title">🤖 고급 설정: AI 판사 Gemini API 연동 (선택)</h3>
          <p style="font-size:0.85rem;color:var(--text-muted)">기본 내장 AI 논리 분석 엔진이 키 없이도 작동합니다. 더 정교한 LLM 판결문을 원하시면 Gemini API 키를 브라우저에 저장할 수 있습니다.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input class="input" id="geminiKeyInput" type="password" style="flex:1;min-width:220px" value="${esc(savedKey)}" placeholder="AIza... (선택 입력)" />
            <button class="btn btn-soft" onclick="saveGeminiKey()">저장</button>
          </div>
        </div>
      `;
    }

    function saveGeminiKey() {
      const val = document.getElementById('geminiKeyInput').value.trim();
      val ? localStorage.setItem('freedom_gemini_key', val) : localStorage.removeItem('freedom_gemini_key');
      toast(val ? '🤖 Gemini AI 판사 키가 저장되었습니다.' : '키가 삭제되었습니다. 기본 AI 분석 엔진을 사용합니다.');
    }

    // =========================================================================
    // 13. 모달 제어 & 부트스트랩
    // =========================================================================
    function openModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      document.getElementById('modalBackdrop').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      state.openDebateId = null;
      state.openPostId = null;
      state.openGuildId = null;
      cleanupLiveRoom();
    }

    async function initApp() {
      await syncSession();
      sb.auth.onAuthStateChange(async () => {
        await syncSession();
        renderCurrentTab();
      });
      await loadAllData();
      setupRealtime();
    }

    initApp();
  </script>
</body>
</html>
