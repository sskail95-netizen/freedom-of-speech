<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>표현의 자유 | 토론 재판장 & 복합 커뮤니티</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; transition: background-color 0.35s ease, color 0.35s ease; }
    .font-court { font-family: 'Noto Serif KR', serif; }

    /* 테마 1: 토론장 (다크 재판장 / 에디토리얼 톤) */
    body.theme-court { background-color: #0b0d12; color: #e8e6e1; }
    .theme-court .surface-card { background-color: #141821; border-color: #262c3a; }
    .theme-court .surface-nav { background-color: rgba(11, 13, 18, 0.92); border-color: #242a38; }
    .theme-court .text-muted { color: #94a3b8; }
    .theme-court .input-box { background-color: #0f131b; border-color: #2e3648; color: #f8fafc; }

    /* 테마 2: 갤러리·소모임·포인트샵 (화사한 라이트 커뮤니티 톤) */
    body.theme-light { background-color: #f4f7fb; color: #1e293b; }
    .theme-light .surface-card { background-color: #ffffff; border-color: #e2e8f0; box-shadow: 0 2px 10px rgba(15,23,42,0.04); }
    .theme-light .surface-nav { background-color: rgba(255, 255, 255, 0.92); border-color: #e2e8f0; }
    .theme-light .text-muted { color: #64748b; }
    .theme-light .input-box { background-color: #f8fafc; border-color: #cbd5e1; color: #0f172a; }

    @keyframes pulseRing { 0% { transform: scale(0.95); opacity: 0.7; } 70% { transform: scale(1.15); opacity: 0; } 100% { transform: scale(1.15); opacity: 0; } }
    .live-pulse::after { content: ''; position: absolute; inset: -4px; border-radius: 9999px; border: 2px solid #ef4444; animation: pulseRing 1.5s infinite; }
  </style>
</head>
<body class="theme-court min-h-screen pb-24 md:pb-10">

  <!-- 상단 네비게이션 (PC 메인 + 모바일 헤더) -->
  <header class="surface-nav sticky top-0 z-40 border-b backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <button onclick="switchTab('debate')" class="flex items-center gap-2 text-left">
        <span id="brand-icon" class="text-2xl">⚖️</span>
        <div>
          <div class="font-court font-extrabold text-lg leading-none tracking-tight">표현의 자유</div>
          <div id="brand-sub" class="text-[11px] text-amber-400 font-medium mt-0.5">THE DEBATE COURT</div>
        </div>
      </button>

      <!-- PC 전용 탭 메뉴 -->
      <nav class="hidden md:flex items-center gap-1.5 font-semibold text-sm">
        <button data-tab="debate" onclick="switchTab('debate')" class="nav-btn px-4 py-2 rounded-lg transition">⚖️ 토론장</button>
        <button data-tab="gallery" onclick="switchTab('gallery')" class="nav-btn px-4 py-2 rounded-lg transition">🌈 갤러리</button>
        <button data-tab="guild" onclick="switchTab('guild')" class="nav-btn px-4 py-2 rounded-lg transition">🛡️ 소모임</button>
        <button data-tab="shop" onclick="switchTab('shop')" class="nav-btn px-4 py-2 rounded-lg transition">🎁 포인트샵</button>
      </nav>

      <!-- 유저 상태 / 로그인 버튼 -->
      <div id="auth-area" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- 메인 콘텐츠 컨테이너 -->
  <main id="app-root" class="max-w-6xl mx-auto px-4 pt-6"></main>

  <!-- 모바일 전용 하단 탭바 -->
  <nav class="surface-nav md:hidden fixed bottom-0 inset-x-0 z-40 border-t backdrop-blur-md">
    <div class="grid grid-cols-5 h-16 text-[11px] font-semibold">
      <button data-tab="debate" onclick="switchTab('debate')" class="mob-btn flex flex-col items-center justify-center gap-0.5"><span class="text-lg">⚖️</span>토론장</button>
      <button data-tab="gallery" onclick="switchTab('gallery')" class="mob-btn flex flex-col items-center justify-center gap-0.5"><span class="text-lg">🌈</span>갤러리</button>
      <button data-tab="guild" onclick="switchTab('guild')" class="mob-btn flex flex-col items-center justify-center gap-0.5"><span class="text-lg">🛡️</span>소모임</button>
      <button data-tab="shop" onclick="switchTab('shop')" class="mob-btn flex flex-col items-center justify-center gap-0.5"><span class="text-lg">🎁</span>포인트샵</button>
      <button data-tab="mypage" onclick="switchTab('mypage')" class="mob-btn flex flex-col items-center justify-center gap-0.5"><span class="text-lg">👤</span>MY</button>
    </div>
  </nav>

  <!-- 공용 모달 컨테이너 -->
  <div id="modal-root" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4"></div>

  <!-- 토스트 알림 -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 hidden px-5 py-3 rounded-full shadow-xl font-semibold text-sm bg-amber-500 text-slate-950 transition"></div>

<script>
// ================= 1. SUPABASE 초기화 =================
const SUPABASE_URL = 'https://fwwjeviebxgaudakqkue.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-T_XVmsB8-xhDP-5sYURTQ_XrUxsIYz';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ================= 2. 전역 상태 =================
const state = {
  user: null,
  profile: null,
  tab: 'debate',           // debate | gallery | guild | shop | mypage
  debateFilter: 'all',     // all | text | voice
  selectedDebateId: null,
  galleryBoard: 'humor',   // humor | free | politics
  selectedPostId: null,
  guildCategory: 'all',    // all | debate | hobby
  selectedGuildId: null,
  debates: [],
  debateArgs: [],
  posts: [],
  comments: [],
  guilds: [],
  guildMembers: [],
  guildPosts: [],
  gifticons: [],
  pointLogs: [],
  orders: [],
  micStream: null
};

// ================= 3. 유틸리티 =================
const esc = (s = '') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate = d => new Date(d).toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

function toast(msg, isErr = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full shadow-xl font-semibold text-sm transition ${isErr ? 'bg-rose-600 text-white' : 'bg-amber-400 text-slate-950'}`;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
}

function openModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="surface-card w-full md:max-w-lg rounded-t-2xl md:rounded-2xl border p-5 max-h-[90vh] overflow-y-auto relative">${html}</div>`;
  root.classList.remove('hidden');
  root.onclick = e => { if (e.target === root) closeModal(); };
}
function closeModal() {
  stopMic();
  document.getElementById('modal-root').classList.add('hidden');
}

function requireAuth() {
  if (!state.user) {
    toast('로그인이 필요한 기능입니다.', true);
    openAuthModal();
    return false;
  }
  return true;
}

// ================= 4. 테마 및 탭 전환 =================
function switchTab(tab) {
  state.tab = tab;
  state.selectedDebateId = null;
  state.selectedPostId = null;
  state.selectedGuildId = null;

  const isCourt = tab === 'debate';
  document.body.className = `${isCourt ? 'theme-court' : 'theme-light'} min-h-screen pb-24 md:pb-10`;
  document.getElementById('brand-icon').textContent = isCourt ? '⚖️' : '✨';
  document.getElementById('brand-sub').textContent = isCourt ? 'THE DEBATE COURT' : 'EVERYDAY COMMUNITY';
  document.getElementById('brand-sub').className = `text-[11px] font-semibold mt-0.5 ${isCourt ? 'text-amber-400' : 'text-sky-600'}`;

  document.querySelectorAll('.nav-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = `nav-btn px-4 py-2 rounded-lg transition ${
      active
        ? (isCourt ? 'bg-amber-500/20 text-amber-400' : 'bg-sky-100 text-sky-700')
        : (isCourt ? 'text-slate-300 hover:bg-slate-800' : 'text-slate-600 hover:bg-slate-100')
    }`;
  });
  document.querySelectorAll('.mob-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.className = `mob-btn flex flex-col items-center justify-center gap-0.5 ${
      active ? (isCourt ? 'text-amber-400' : 'text-sky-600') : 'text-muted'
    }`;
  });

  if (tab === 'mypage' || tab === 'shop') loadMyData();
  render();
}

// ================= 5. 인증 (Supabase Auth) =================
async function syncSession() {
  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user || null;
  if (state.user) {
    const { data } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
    state.profile = data;
    await loadMyData();
  } else {
    state.profile = null;
  }
  renderAuthArea();
  render();
}

function renderAuthArea() {
  const el = document.getElementById('auth-area');
  if (!state.user) {
    el.innerHTML = `<button onclick="openAuthModal()" class="px-4 py-2 rounded-lg text-xs md:text-sm font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 transition">로그인 / 가입</button>`;
    return;
  }
  const pts = state.profile?.points ?? 0;
  const name = esc(state.profile?.username || state.user.email?.split('@')[0]);
  el.innerHTML = `
    <button onclick="handleCheckin()" class="hidden sm:inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500/15 text-emerald-500 border border-emerald-500/30 hover:bg-emerald-500/25">📅 출석 +50P</button>
    <button onclick="switchTab('mypage')" class="flex items-center gap-2 px-3 py-1.5 rounded-lg surface-card border text-xs md:text-sm font-semibold">
      <span>${name}</span>
      <span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-500 font-bold">${pts.toLocaleString()}P</span>
    </button>
  `;
}

function openAuthModal(mode = 'login') {
  openModal(`
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-extrabold">${mode === 'login' ? '로그인' : '회원가입 (+100P 지급)'}</h2>
      <button onclick="closeModal()" class="text-muted text-xl">&times;</button>
    </div>
    <form onsubmit="submitAuth(event, '${mode}')" class="space-y-3">
      ${mode === 'signup' ? `<input id="auth-name" required placeholder="닉네임" class="input-box w-full px-3.5 py-2.5 rounded-xl border text-sm" />` : ''}
      <input id="auth-email" type="email" required placeholder="이메일 주소" class="input-box w-full px-3.5 py-2.5 rounded-xl border text-sm" />
      <input id="auth-pw" type="password" required minlength="6" placeholder="비밀번호 (6자 이상)" class="input-box w-full px-3.5 py-2.5 rounded-xl border text-sm" />
      <button type="submit" class="w-full py-3 rounded-xl font-bold bg-amber-500 hover:bg-amber-400 text-slate-950">${mode === 'login' ? '이메일로 로그인' : '회원가입 완료'}</button>
    </form>
    <div class="my-4 flex items-center gap-2 text-xs text-muted"><div class="flex-1 h-px bg-slate-500/30"></div>소셜 로그인<div class="flex-1 h-px bg-slate-500/30"></div></div>
    <div class="grid grid-cols-3 gap-2 text-xs font-bold">
      <button onclick="oauthLogin('google')" class="py-2.5 rounded-xl border surface-card hover:opacity-80">Google</button>
      <button onclick="oauthLogin('kakao')" class="py-2.5 rounded-xl bg-[#FEE500] text-slate-900 hover:opacity-90">Kakao</button>
      <button onclick="oauthLogin('github')" class="py-2.5 rounded-xl bg-slate-800 text-white hover:opacity-90">GitHub</button>
    </div>
    <div class="mt-4 text-center text-xs text-muted">
      ${mode === 'login'
        ? `계정이 없으신가요? <button onclick="openAuthModal('signup')" class="text-amber-500 font-bold underline">회원가입</button>`
        : `이미 계정이 있으신가요? <button onclick="openAuthModal('login')" class="text-amber-500 font-bold underline">로그인</button>`}
    </div>
  `);
}

async function submitAuth(e, mode) {
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pw').value;
  if (mode === 'signup') {
    const username = document.getElementById('auth-name').value.trim();
    const { error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
    if (error) return toast(error.message, true);
    toast('가입 완료! 이메일 인증 또는 바로 로그인됩니다.');
    closeModal();
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return toast('이메일 또는 비밀번호를 확인해주세요.', true);
    toast('환영합니다!');
    closeModal();
  }
  await syncSession();
}

async function oauthLogin(provider) {
  const { error } = await sb.auth.signInWithOAuth({
    provider,
    options: { redirectTo: window.location.origin }
  });
  if (error) toast(`${provider} 로그인 설정을 Supabase 대시보드에서 활성화해주세요.`, true);
}

async function logout() {
  await sb.auth.signOut();
  toast('로그아웃되었습니다.');
  await syncSession();
}

// ================= 6. 데이터 로드 & 실시간 구독 =================
async function loadAllData() {
  const [d, p, g, gm, gifts] = await Promise.all([
    sb.from('debates').select('*').order('created_at', { ascending: false }),
    sb.from('posts').select('*').order('created_at', { ascending: false }),
    sb.from('guilds').select('*').order('activity_score', { ascending: false }),
    sb.from('guild_members').select('*'),
    sb.from('gifticons').select('*').order('price', { ascending: true })
  ]);
  state.debates = d.data || [];
  state.posts = p.data || [];
  state.guilds = g.data || [];
  state.guildMembers = gm.data || [];
  state.gifticons = gifts.data || [];
  render();
}

async function loadMyData() {
  if (!state.user) return;
  const [prof, logs, orders] = await Promise.all([
    sb.from('profiles').select('*').eq('id', state.user.id).single(),
    sb.from('point_logs').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false }).limit(30),
    sb.from('gifticon_orders').select('*').eq('user_id', state.user.id).order('created_at', { ascending: false })
  ]);
  if (prof.data) state.profile = prof.data;
  state.pointLogs = logs.data || [];
  state.orders = orders.data || [];
  renderAuthArea();
}

function setupRealtime() {
  sb.channel('global-community-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'debates' }, async () => {
      const { data } = await sb.from('debates').select('*').order('created_at', { ascending: false });
      state.debates = data || [];
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'debate_arguments' }, async () => {
      if (state.selectedDebateId) await loadDebateArgs(state.selectedDebateId);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, async () => {
      const { data } = await sb.from('posts').select('*').order('created_at', { ascending: false });
      state.posts = data || [];
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, async () => {
      if (state.selectedPostId) await loadComments(state.selectedPostId);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'guilds' }, loadAllData)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'guild_members' }, loadAllData)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'guild_posts' }, async () => {
      if (state.selectedGuildId) await loadGuildPosts(state.selectedGuildId);
    })
    .subscribe();
}

// ================= 7. 렌더링 라우터 =================
function render() {
  const root = document.getElementById('app-root');
  if (state.tab === 'debate') root.innerHTML = state.selectedDebateId ? renderDebateDetail() : renderDebateList();
  else if (state.tab === 'gallery') root.innerHTML = state.selectedPostId ? renderPostDetail() : renderGallery();
  else if (state.tab === 'guild') root.innerHTML = state.selectedGuildId ? renderGuildDetail() : renderGuildList();
  else if (state.tab === 'shop') root.innerHTML = renderShop();
  else if (state.tab === 'mypage') root.innerHTML = renderMyPage();
}

// ================= 8. 토론장 (텍스트 / 1:1 라이브 보이스 / AI 판사) =================
function renderDebateList() {
  const list = state.debates.filter(d => state.debateFilter === 'all' || d.type === state.debateFilter);
  return `
    <section class="mb-6 p-6 rounded-2xl border border-amber-500/30 bg-gradient-to-br from-[#171b26] to-[#0e1118] flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-500/15 text-amber-400 border border-amber-500/30 mb-2">THE COURT OF EXPRESSION</span>
        <h1 class="font-court text-2xl md:text-3xl font-extrabold text-white">토론 재판장</h1>
        <p class="text-sm text-muted mt-1">1:1 실시간 보이스 대결부터 마감 기한 논리 토론과 AI 판사의 최종 판결까지.</p>
      </div>
      <button onclick="openCreateDebateModal()" class="px-5 py-3 rounded-xl font-bold text-sm bg-amber-500 hover:bg-amber-400 text-slate-950 shrink-0">+ 새 안건 발의 (+30P)</button>
    </section>

    <div class="flex gap-2 mb-5 overflow-x-auto pb-1">
      ${[['all','전체 안건'],['text','📜 텍스트 토론'],['voice','🎙️ 1:1 라이브 보이스']].map(([k,v]) => `
        <button onclick="state.debateFilter='${k}';render()" class="px-4 py-2 rounded-xl text-xs md:text-sm font-bold border shrink-0 ${state.debateFilter===k ? 'bg-amber-500 text-slate-950 border-amber-500' : 'surface-card text-slate-300'}">${v}</button>
      `).join('')}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${list.length ? list.map(d => {
        const isLive = d.type === 'voice';
        const isClosed = d.status === 'closed' || new Date(d.deadline) < new Date();
        const total = (d.pro_cheers || 0) + (d.con_cheers || 0) || 1;
        const proPct = Math.round(((d.pro_cheers || 0) / total) * 100);
        return `
        <article onclick="openDebate('${d.id}')" class="surface-card border rounded-2xl p-5 cursor-pointer hover:border-amber-500/60 transition flex flex-col justify-between gap-4">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <span class="px-2.5 py-1 rounded-md text-[11px] font-bold ${isLive ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/15 text-amber-400'}">
                ${isLive ? '🔴 LIVE 1:1 보이스' : '📜 마감 토론'}
              </span>
              <span class="text-xs text-muted">${isClosed ? '⚖️ 판결/종료' : '마감: ' + fmtDate(d.deadline)}</span>
            </div>
            <h3 class="font-court text-lg font-bold text-white leading-snug">${esc(d.title)}</h3>
            <p class="text-xs text-muted mt-1.5 line-clamp-2">${esc(d.description)}</p>
          </div>
          <div>
            <div class="flex justify-between text-xs font-bold mb-1">
              <span class="text-sky-400">${esc(d.pro_label)} (${d.pro_cheers})</span>
              <span class="text-rose-400">${esc(d.con_label)} (${d.con_cheers})</span>
            </div>
            <div class="w-full h-2 rounded-full bg-rose-500/40 overflow-hidden">
              <div class="h-full bg-sky-400 transition-all" style="width:${proPct}%"></div>
            </div>
            ${d.ai_verdict ? `<div class="mt-3 text-xs font-bold text-amber-400">⚖️ AI 판결 완료 · 승자: ${esc(d.ai_verdict.winner)}</div>` : ''}
          </div>
        </article>`;
      }).join('') : `<div class="col-span-full surface-card border rounded-2xl p-12 text-center text-muted">아직 발의된 토론 안건이 없습니다. 첫 번째 안건을 열어보세요!</div>`}
    </div>
  `;
}

async function openDebate(id) {
  state.selectedDebateId = id;
  await loadDebateArgs(id);
}
async function loadDebateArgs(id) {
  const { data } = await sb.from('debate_arguments').select('*').eq('debate_id', id).order('created_at', { ascending: true });
  state.debateArgs = data || [];
  render();
}

function renderDebateDetail() {
  const d = state.debates.find(x => x.id === state.selectedDebateId);
  if (!d) return '';
  const isLive = d.type === 'voice';
  const total = (d.pro_cheers || 0) + (d.con_cheers || 0) || 1;

async function createDebate(e) {
  e.preventDefault();
  const { error } = await sb.from('debates').insert({
    author_id: state.user.id,
    author_name: state.profile?.username || '익명',
    type: document.getElementById('d-type').value,
    title: document.getElementById('d-title').value.trim(),
    description: document.getElementById('d-desc').value.trim(),
    pro_label: document.getElementById('d-pro').value.trim() || '찬성',
    con_label: document.getElementById('d-con').value.trim() || '반대',
    deadline: new Date(document.getElementById('d-deadline').value).toISOString()
  });
  if (error) return toast(error.message, true);
  await sb.rpc('award_points', { p_amount: 30, p_reason: '토론 안건 발의 보상' });
  await loadMyData();
  closeModal();
  toast('안건이 발의되었습니다! (+30P)');
}

async function submitArgument(e, debateId) {
  e.preventDefault();
  if (!requireAuth()) return;
  const content = document.getElementById('arg-content').value.trim();
  const side = document.getElementById('arg-side').value;
  const { error } = await sb.from('debate_arguments').insert({
    debate_id: debateId, author_id: state.user.id,
    author_name: state.profile?.username || '익명', side, content
  });
  if (error) return toast(error.message, true);
  document.getElementById('arg-content').value = '';
  await sb.rpc('award_points', { p_amount: 10, p_reason: '토론 발언 참여' });
  await loadMyData();
}

async function cheerDebate(id, side) {
  await sb.rpc('cheer_debate', { p_debate_id: id, p_side: side });
  toast('실시간 응원이 반영되었습니다!');
}

async function joinSpeaker(debateId, side) {
  if (!requireAuth()) return;
  try {
    state.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    document.getElementById('mic-status')?.classList.remove('hidden');
  } catch {
    toast('마이크 권한 없이 발언석에 입장합니다.');
  }
  const patch = side === 'pro'
    ? { pro_speaker: state.profile?.username || '논객' }
    : { con_speaker: state.profile?.username || '논객' };
  await sb.from('debates').update(patch).eq('id', debateId);
  toast('1:1 라이브 발언석에 착석했습니다!');
}

function stopMic() {
  if (state.micStream) {
    state.micStream.getTracks().forEach(t => t.stop());
    state.micStream = null;
  }
}

async function requestAiVerdict(debateId) {
  if (!requireAuth()) return;
  const d = state.debates.find(x => x.id === debateId);
  const proArgs = state.debateArgs.filter(a => a.side === 'pro');
  const conArgs = state.debateArgs.filter(a => a.side === 'con');

  const proScore = proArgs.reduce((acc, a) => acc + Math.min(a.content.length, 120), 0) + (d.pro_cheers * 15);
  const conScore = conArgs.reduce((acc, a) => acc + Math.min(a.content.length, 120), 0) + (d.con_cheers * 15);
  const winner = proScore >= conScore ? d.pro_label : d.con_label;

  const ai_verdict = {
    winner,
    pro_summary: proArgs.length ? `${proArgs.length}건의 논거 제시 — 핵심 주장: "${proArgs[0].content.slice(0, 80)}"` : '제시된 텍스트 논거 없음 (응원 점수 반영)',
    con_summary: conArgs.length ? `${conArgs.length}건의 논거 제시 — 핵심 주장: "${conArgs[0].content.slice(0, 80)}"` : '제시된 텍스트 논거 없음 (응원 점수 반영)',
    verdict_text: `본 재판부는 양측의 논리 밀도(발언 ${proArgs.length}건 vs ${conArgs.length}건) 및 배심원단 응원(${d.pro_cheers} vs ${d.con_cheers})을 종합 심리한 결과, 설득력 우위를 점한 [${winner}] 측의 승리를 선고합니다.`
  };

  await sb.from('debates').update({ status: 'closed', ai_verdict }).eq('id', debateId);
  toast('⚖️ AI 판사의 최종 판결이 선고되었습니다!');
}

async function createPost(e) {
  e.preventDefault();
  const btn = document.getElementById('p-submit-btn');
  btn.disabled = true; btn.textContent = '업로드 중...';

  let media_url = null, media_type = null;
  const file = document.getElementById('p-file').files[0];
  if (file) {
    const ext = file.name.split('.').pop();
    const path = `${state.user.id}/${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('community-media').upload(path, file);
    if (upErr) { btn.disabled = false; return toast('파일 업로드 실패: ' + upErr.message, true); }
    const { data } = sb.storage.from('community-media').getPublicUrl(path);
    media_url = data.publicUrl;
    media_type = file.type.startsWith('video') ? 'video' : 'image';
  }

  const board = document.getElementById('p-board').value;
  const { error } = await sb.from('posts').insert({
    author_id: state.user.id, author_name: state.profile?.username || '익명',
    board, title: document.getElementById('p-title').value.trim(),
    content: document.getElementById('p-content').value.trim(), media_url, media_type
  });
  if (error) { btn.disabled = false; return toast(error.message, true); }
  await sb.rpc('award_points', { p_amount: 20, p_reason: '갤러리 게시글 작성' });
  state.galleryBoard = board;
  await loadMyData();
  closeModal();
  toast('게시글이 등록되었습니다! (+20P)');
}

async function likePost(id) {
  const { data } = await sb.rpc('like_post_and_check_hot', { p_post_id: id });
  toast(data?.hot_triggered ? '🔥 핫이슈로 승격되어 작성자에게 +200P가 지급되었습니다!' : '게시글을 추천했습니다!');
}

async function submitComment(e, postId) {
  e.preventDefault();
  if (!requireAuth()) return;
  const content = document.getElementById('c-input').value.trim();
  const { error } = await sb.from('comments').insert({
    post_id: postId, author_id: state.user.id, author_name: state.profile?.username || '익명', content
  });
  if (error) return toast(error.message, true);
  document.getElementById('c-input').value = '';
  await sb.rpc('award_points', { p_amount: 5, p_reason: '댓글 작성 보상' });
  await loadMyData();
}

// ================= 10. 소모임 시스템 (길드 개념) =================
function renderGuildList() {
  const list = state.guilds.filter(g => state.guildCategory === 'all' || g.category === state.guildCategory);
  return `
    <section class="mb-6 p-6 rounded-2xl bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-md">
      <div>
        <span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-bold bg-white/20 mb-2">COMMUNITY GUILDS</span>
        <h1 class="text-2xl md:text-3xl font-extrabold">소모임 · 길드 라운지</h1>
        <p class="text-sm text-violet-100 mt-1">토론 길드와 취미 길드에 가입해 전용 게시판과 모임 일정을 함께하세요.</p>
      </div>
      <button onclick="openCreateGuildModal()" class="px-5 py-3 rounded-xl font-bold text-sm bg-white text-violet-700 hover:bg-violet-50 shrink-0 shadow">+ 새 길드 창설</button>
    </section>

    <div class="flex gap-2 mb-5">
      ${[['all','전체 길드'],['debate','⚖️ 토론 소모임'],['hobby','🎨 취미 소모임']].map(([k,v]) => `
        <button onclick="state.guildCategory='${k}';render()" class="px-4 py-2 rounded-xl text-xs md:text-sm font-bold border ${state.guildCategory===k ? 'bg-violet-600 text-white border-violet-600' : 'surface-card'}">${v}</button>
      `).join('')}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${list.map((g, idx) => {
        const members = state.guildMembers.filter(m => m.guild_id === g.id);
        return `
        <article onclick="openGuild('${g.id}')" class="surface-card border rounded-2xl p-5 cursor-pointer hover:border-violet-400 transition">
          <div class="flex items-center justify-between mb-2">
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${g.category==='debate' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">
              ${g.category==='debate' ? '⚖️ 토론 길드' : '🎨 취미 길드'}
            </span>
            <span class="text-xs font-extrabold text-violet-600">🏆 랭킹 #${idx+1} · 활동도 ${g.activity_score}</span>
          </div>
          <h3 class="text-lg font-extrabold">${esc(g.name)}</h3>
          <p class="text-xs text-muted mt-1 line-clamp-2">${esc(g.description)}</p>
          <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between text-xs text-muted font-semibold">
            <span>길드장: ${esc(g.leader_name)}</span>
            <span>👥 멤버 ${members.length}명</span>
          </div>
        </article>`;
      }).join('') || `<div class="col-span-full surface-card border rounded-2xl p-12 text-center text-muted">첫 번째 소모임 길드를 창설해보세요!</div>`}
    </div>
  `;
}

async function openGuild(id) {
  state.selectedGuildId = id;
  await loadGuildPosts(id);
}
async function loadGuildPosts(guildId) {
  const { data } = await sb.from('guild_posts').select('*').eq('guild_id', guildId).order('created_at', { ascending: false });
  state.guildPosts = data || [];
  render();
}

function renderGuildDetail() {
  const g = state.guilds.find(x => x.id === state.selectedGuildId);
  if (!g) return '';
  const members = state.guildMembers.filter(m => m.guild_id === g.id);
  const isMember = state.user && members.some(m => m.user_id === state.user.id);

  return `
    <button onclick="state.selectedGuildId=null;render()" class="mb-4 text-sm text-violet-600 font-bold">← 소모임 목록으로</button>
    <div class="surface-card border rounded-2xl p-5 md:p-6 mb-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <span class="text-xs font-bold text-violet-600">${g.category==='debate' ? '⚖️ 토론 길드' : '🎨 취미 길드'} · 활동도 ${g.activity_score}</span>
        <h1 class="text-2xl font-extrabold mt-1">${esc(g.name)}</h1>
        <p class="text-sm text-muted mt-1">${esc(g.description)}</p>
        <div class="text-xs text-muted mt-2">👥 멤버 ${members.length}명: ${members.map(m => esc(m.username)).join(', ')}</div>
      </div>
      ${isMember
        ? `<span class="px-4 py-2 rounded-xl bg-emerald-100 text-emerald-700 font-bold text-xs shrink-0">✓ 가입된 길드</span>`
        : `<button onclick="joinGuild('${g.id}')" class="px-5 py-3 rounded-xl bg-violet-600 text-white font-bold text-sm shrink-0">길드 가입 신청</button>`}
    </div>

    ${isMember ? `
    <form onsubmit="createGuildPost(event, '${g.id}')" class="surface-card border rounded-2xl p-4 mb-5 space-y-2.5">
      <div class="flex gap-2">
        <select id="gp-type" class="input-box px-3 py-2 rounded-xl border text-xs font-bold">
          <option value="post">📝 길드 게시글</option>
          <option value="schedule">📅 모임 일정</option>
        </select>
        <input id="gp-date" placeholder="일정 날짜 (선택: 예 11/30 오후 8시)" class="input-box flex-1 px-3 py-2 rounded-xl border text-xs" />
      </div>
      <input id="gp-title" required placeholder="제목" class="input-box w-full px-3.5 py-2 rounded-xl border text-sm" />
      <div class="flex gap-2">
        <input id="gp-content" required placeholder="길드원들과 나눌 내용 또는 모임 장소" class="input-box flex-1 px-3.5 py-2 rounded-xl border text-sm" />
        <button type="submit" class="px-5 py-2 rounded-xl bg-violet-600 text-white font-bold text-sm">등록</button>
      </div>
    </form>` : ''}

    <div class="space-y-3">
      ${state.guildPosts.map(gp => `
        <div class="surface-card border rounded-xl p-4">
          <div class="flex items-center justify-between text-xs mb-1">
            <span class="font-bold ${gp.type==='schedule' ? 'text-rose-600' : 'text-violet-600'}">
              ${gp.type==='schedule' ? `📅 모임 일정 ${gp.event_date ? '('+esc(gp.event_date)+')' : ''}` : '📝 길드 게시판'}
            </span>
            <span class="text-muted">${esc(gp.author_name)} · ${fmtDate(gp.created_at)}</span>
          </div>
          <h4 class="font-bold text-sm">${esc(gp.title)}</h4>
          <p class="text-xs text-muted mt-1">${esc(gp.content)}</p>
        </div>
      `).join('') || `<div class="surface-card border rounded-xl p-8 text-center text-xs text-muted">아직 등록된 길드 글이나 모임 일정이 없습니다.</div>`}
    </div>
  `;
}

function openCreateGuildModal() {
  if (!requireAuth()) return;
  openModal(`
    <h2 class="text-xl font-extrabold mb-4">🛡️ 새 길드(소모임) 창설</h2>
    <form onsubmit="createGuild(event)" class="space-y-3">
      <select id="g-cat" class="input-box w-full px-3.5 py-2.5 rounded-xl border text-sm font-bold">
        <option value="debate">⚖️ 토론 소모임</option>
        <option value="hobby">🎨 취미 소모임</option>
      </select>
      <input id="g-name" required placeholder="길드 이름" class="input-box w-full px-3.5 py-2.5 rounded-xl border text-sm" />
      <textarea id="g-desc" required rows="3" placeholder="길드 소개 및 활동 목표" class="input-box w-full px-3.5 py-2.5 rounded-xl border text-sm"></textarea>
      <button type="submit" class="w-full py-3 rounded-xl font-bold bg-violet-600 text-white">길드 창설하기</button>
    </form>
  `);
}

async function createGuild(e) {
  e.preventDefault();
  const uname = state.profile?.username || '길드장';
  const { data, error } = await sb.from('guilds').insert({
    category: document.getElementById('g-cat').value,
    name: document.getElementById('g-name').value.trim(),
    description: document.getElementById('g-desc').value.trim(),
    leader_id: state.user.id, leader_name: uname
  }).select().single();
  if (error) return toast(error.message, true);
  await sb.from('guild_members').insert({ guild_id: data.id, user_id: state.user.id, username: uname, role: 'leader' });
  closeModal();
  toast('새 길드가 창설되었습니다!');
}

async function joinGuild(guildId) {
  if (!requireAuth()) return;
  const { error } = await sb.from('guild_members').insert({
    guild_id: guildId, user_id: state.user.id, username: state.profile?.username || '멤버'
  });
  if (error) return toast('이미 가입되었거나 오류가 발생했습니다.', true);
  toast('길드 가입이 완료되었습니다!');
}

async function createGuildPost(e, guildId) {
  e.preventDefault();
  const { error } = await sb.from('guild_posts').insert({
    guild_id: guildId, author_id: state.user.id, author_name: state.profile?.username || '멤버',
    type: document.getElementById('gp-type').value,
    event_date: document.getElementById('gp-date').value.trim() || null,
    title: document.getElementById('gp-title').value.trim(),
    content: document.getElementById('gp-content').value.trim()
  });
  if (error) return toast(error.message, true);
  const g = state.guilds.find(x => x.id === guildId);
  if (g) await sb.from('guilds').update({ activity_score: g.activity_score + 10 }).eq('id', guildId);
  e.target.reset();
  toast('등록 완료! 길드 활동도가 +10 상승했습니다.');
}

// ================= 11. 포인트 샵 & 마이페이지 =================
function renderShop() {
  const pts = state.profile?.points ?? 0;
  return `
    <section class="mb-6 p-6 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 text-white flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-md">
      <div>
        <span class="inline-block px-2.5 py-1 rounded-full text-[11px] font-bold bg-white/20 mb-2">POINT REWARD SHOP</span>
        <h1 class="text-2xl md:text-3xl font-extrabold">기프티콘 포인트 교환소</h1>
        <p class="text-sm text-amber-50 mt-1">출석(+50P)·토론(+30P)·글쓰기(+20P)·핫이슈(+200P)로 모은 포인트를 기프티콘으로 교환하세요.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="handleCheckin()" class="px-4 py-3 rounded-xl bg-white/20 hover:bg-white/30 font-bold text-sm">📅 출석 +50P</button>
        <div class="px-4 py-3 rounded-xl bg-white text-amber-600 font-extrabold text-sm">내 보유: ${pts.toLocaleString()}P</div>
      </div>
    </section>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      ${state.gifticons.map(g => `
        <div class="surface-card border rounded-2xl p-5 flex flex-col justify-between text-center">
          <div>
            <div class="text-5xl my-3">${esc(g.emoji)}</div>
            <div class="text-xs font-bold text-muted">${esc(g.brand)}</div>
            <h3 class="font-extrabold text-base mt-0.5">${esc(g.name)}</h3>
            <div class="text-lg font-extrabold text-amber-600 mt-2">${g.price.toLocaleString()}P</div>
          </div>
          <button onclick="buyGifticon('${g.id}')" class="mt-4 w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm">교환하기</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderMyPage() {
  if (!state.user) {
    return `<div class="surface-card border rounded-2xl p-12 text-center">
      <p class="font-bold mb-3">로그인 후 내 포인트와 기프티콘 보관함을 확인할 수 있습니다.</p>
      <button onclick="openAuthModal()" class="px-6 py-3 rounded-xl bg-amber-500 text-slate-950 font-bold">로그인 / 회원가입</button>
    </div>`;
  }
  return `
    <div class="surface-card border rounded-2xl p-6 mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold">${esc(state.profile?.username)} 님의 마이페이지</h1>
        <p class="text-sm text-muted">${esc(state.user.email)}</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="px-4 py-2 rounded-xl bg-amber-100 text-amber-700 font-extrabold">보유 ${(state.profile?.points ?? 0).toLocaleString()}P</span>
        <button onclick="logout()" class="px-4 py-2 rounded-xl border text-xs font-bold text-rose-600">로그아웃</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div class="surface-card border rounded-2xl p-5">
        <h2 class="font-extrabold text-base mb-3">🎟️ 교환한 기프티콘 보관함</h2>
        <div class="space-y-2.5">
          ${state.orders.map(o => `
            <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 flex justify-between items-center">
              <div>
                <div class="font-bold text-sm text-slate-800">${esc(o.gifticon_name)}</div>
                <div class="text-xs text-muted">${fmtDate(o.created_at)}</div>
              </div>
              <code class="px-2.5 py-1 rounded bg-white border font-mono text-xs font-bold text-amber-700">${esc(o.coupon_code)}</code>
            </div>
          `).join('') || `<p class="text-xs text-muted">교환한 기프티콘이 없습니다.</p>`}
        </div>
      </div>

      <div class="surface-card border rounded-2xl p-5">
        <h2 class="font-extrabold text-base mb-3">📊 포인트 적립·사용 내역</h2>
        <div class="space-y-2 max-h-80 overflow-y-auto">
          ${state.pointLogs.map(l => `
            <div class="flex justify-between items-center py-2 border-b border-slate-100 text-sm">
              <div>
                <div class="font-medium">${esc(l.reason)}</div>
                <div class="text-[11px] text-muted">${fmtDate(l.created_at)}</div>
              </div>
              <span class="font-extrabold ${l.amount > 0 ? 'text-emerald-600' : 'text-rose-600'}">${l.amount > 0 ? '+' : ''}${l.amount}P</span>
            </div>
          `).join('') || `<p class="text-xs text-muted">내역이 없습니다.</p>`}
        </div>
      </div>
    </div>
  `;
}

async function handleCheckin() {
  if (!requireAuth()) return;
  const { data, error } = await sb.rpc('daily_checkin');
  if (error) return toast(error.message, true);
  toast(data.message, !data.ok);
  await loadMyData();
  render();
}

async function buyGifticon(id) {
  if (!requireAuth()) return;
  const { data, error } = await sb.rpc('purchase_gifticon', { p_gifticon_id: id });
  if (error) return toast(error.message, true);
  if (!data.ok) return toast(data.message, true);
  toast(`🎉 교환 완료! 쿠폰번호: ${data.coupon_code}`);
  await loadMyData();
  switchTab('mypage');
}

// ================= 12. 앱 부팅 =================
(async function init() {
  switchTab('debate');
  await syncSession();
  await loadAllData();
  setupRealtime();
  sb.auth.onAuthStateChange(() => syncSession());
})();
</script>
</body>
